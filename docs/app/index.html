<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; frame-src blob:; child-src blob:; worker-src 'none'; object-src 'none'; font-src 'none'; media-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Magenta</title>
  <meta name="description" content="Magenta in your browser: chat with your own API key or endpoint. Requests go straight from your browser to the provider.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.c1ad253746e8.css" integrity="sha384-Tc3OHlu0VX2zhk6m4ygzVs0bVRjVu+C1iXaFFKZtzF8KajAL20mKgEHqW8UESZKW">
  <script src="vendor/marked.min.js" integrity="sha384-8o82OW6HW401nUj7wf2ObxhNTCM0o9aVFBtLgVSDm/QRsHHyJRYJWmZkt7vTkiWg" defer></script>
  <script src="vendor/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" defer></script>
  <script type="module" src="app.18c444fe1bb5.js" integrity="sha384-5VmWVC+UD20ydXfnOl+6ZMUGBXsQE16Hd5dyEhSyc7ppqtQiMMjQ2oY+FCkRacaB"></script>
</head>
<body>
  <a class="skip-link" href="#composer-input" data-i18n="page.skip">Skip to message box</a>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Sessions" data-i18n-aria-label="page.sessions">
      <header class="sidebar-head">
        <picture class="brand">
          <source srcset="mark-dark.svg" media="(prefers-color-scheme: dark)">
          <img src="mark.svg" alt="Magenta" width="28" height="28">
        </picture>
        <span class="brand-name">Magenta</span>
        <button id="new-chat" class="btn primary" type="button" title="New chat" data-i18n="page.newChat" data-i18n-title="page.newChat">New chat</button>
        <button id="close-sidebar" class="btn icon narrow-only" type="button" aria-label="Close sessions" data-i18n-aria-label="page.closeSessions">&#10005;</button>
      </header>
      <label class="visually-hidden" for="session-search" data-i18n="page.searchSessions">Search sessions</label>
      <input id="session-search" class="search" type="search" placeholder="Search sessions" data-i18n-placeholder="page.searchSessions" autocomplete="off">
      <div id="session-files" class="session-files" hidden>
        <button id="import-session" class="btn small" type="button" title="Open a Magenta session JSONL file" data-i18n="page.importSession" data-i18n-title="page.importSessionTitle">Import session</button>
        <input id="import-file" type="file" accept=".jsonl,application/x-ndjson,application/jsonl" hidden>
      </div>
      <nav id="session-list" class="session-list" aria-label="Session list" data-i18n-aria-label="page.sessionList"></nav>
      <section id="tree-panel" class="tree-panel" aria-labelledby="tree-title">
        <h2 id="tree-title" class="panel-title" data-i18n="page.sessionTree">Session tree</h2>
        <div id="session-tree" class="session-tree" role="tree" aria-label="Session tree" data-i18n-aria-label="page.sessionTree"></div>
      </section>
      <div class="settings">
        <label for="language-picker" data-i18n="page.language">Language</label>
        <select id="language-picker" class="language-picker"></select>
      </div>
      <footer id="host-links" class="host-links"></footer>
    </aside>
    <main class="main" aria-label="Conversation" data-i18n-aria-label="page.conversation">
      <header class="topbar">
        <button id="toggle-sidebar" class="btn icon" type="button" aria-controls="sidebar" aria-expanded="true" title="Toggle sessions" data-i18n-title="page.toggleSessions">&#9776;</button>
        <h1 id="session-title" class="session-title">Magenta</h1>
        <label class="visually-hidden" for="model-picker" data-i18n="page.model">Model</label>
        <select id="model-picker" class="model-picker" title="Model and route" data-i18n-title="page.modelTitle"></select>
        <label class="visually-hidden" for="thinking-picker" data-i18n="page.thinkingLevel">Thinking level</label>
        <select id="thinking-picker" class="model-picker thinking-picker" title="Thinking level" data-i18n-title="page.thinkingLevel" hidden></select>
        <button id="open-signin" class="btn" type="button" aria-haspopup="dialog" data-i18n="page.signIn">Sign-in</button>
        <button id="export" class="btn" type="button" title="Download an auditable HTML export" data-i18n="page.export" data-i18n-title="page.exportTitle">Export</button>
        <button id="share" class="btn" type="button" title="Publish a secret gist with a viewer link" data-i18n="page.share" data-i18n-title="page.shareTitle">Share</button>
      </header>
      <div id="banner" class="banner" role="status" hidden></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <footer class="composer-area">
        <div id="slash-menu" class="slash-menu" role="listbox" aria-label="Commands" data-i18n-aria-label="page.commands" hidden></div>
        <form id="composer" class="composer" autocomplete="off">
          <label class="visually-hidden" for="composer-input" data-i18n="page.message">Message</label>
          <textarea id="composer-input" rows="1" placeholder="Message Magenta (Enter to send, Shift+Enter for a new line, / for commands)" data-i18n-placeholder="composer.placeholder" aria-describedby="usage"></textarea>
          <button id="send" class="btn primary" type="submit" data-i18n="page.send">Send</button>
          <button id="stop" class="btn danger" type="button" data-i18n="page.stop" hidden>Stop</button>
        </form>
        <div id="queue" class="queue" aria-live="polite"></div>
        <div id="usage" class="usage" aria-live="off"></div>
      </footer>
    </main>
  </div>
  <dialog id="signin-dialog" class="dialog signin-dialog" aria-labelledby="signin-title">
    <div class="dialog-frame">
      <header class="dialog-head">
        <h2 id="signin-title" data-i18n="page.signIn">Sign-in</h2>
        <button id="signin-close" class="btn" type="button" data-i18n="page.close">Close</button>
      </header>
      <div class="dialog-scroll">
        <p id="signin-note" class="muted" data-i18n="page.signInNote">Credentials stay in this machine's Magenta store. This page only sees whether a provider is signed in.</p>
        <div id="signin-flow" class="signin-flow" aria-live="polite"></div>
        <div id="signin-providers" class="signin-providers"></div>
      </div>
    </div>
  </dialog>
  <noscript>Magenta web needs JavaScript.</noscript>
</body>
</html>
