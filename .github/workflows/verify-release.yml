name: Verify Published Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      allow_draft:
        description: Permit verification before publication
        required: true
        default: false
        type: boolean

# Published-release metadata is read-only by default. Draft release metadata is
# visible only with push-equivalent access, so that permission is scoped to the
# two verification jobs that support the explicit allow_draft gate.
permissions:
  contents: read

concurrency:
  group: verify-published-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  windows-runtime:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    environment:
      name: source-verification
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ALLOW_DRAFT: ${{ inputs.allow_draft }}
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: refs/heads/main

      - name: Test verifier and public installation entrypoints
        shell: pwsh
        run: |
          node --test .github/scripts/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Release verifier tests failed" }
          node .github/scripts/verify-distribution-entrypoints.mjs
          if ($LASTEXITCODE -ne 0) { throw "Distribution entrypoint policy failed" }
          node .github/scripts/verify-release-workflow-policy.mjs
          if ($LASTEXITCODE -ne 0) { throw "Release workflow policy failed" }
          node .github/scripts/verify-ci-workflow-policy.mjs
          if ($LASTEXITCODE -ne 0) { throw "Distribution CI policy failed" }

      - name: Verify assets, installer, and native runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MAGENTA_SOURCE_READ_TOKEN: ${{ secrets.MAGENTA_SOURCE_READ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:MAGENTA_SOURCE_READ_TOKEN)) {
            throw "MAGENTA_SOURCE_READ_TOKEN is required for private source verification"
          }
          function Assert-MagentaPlainTree([string]$Root) {
            $rootItem = Get-Item -LiteralPath $Root -Force -ErrorAction Stop
            if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Magenta isolated root is not a plain directory: $Root"
            }
            $pending = New-Object "System.Collections.Generic.Stack[string]"
            [void]$pending.Push($rootItem.FullName)
            while ($pending.Count -gt 0) {
              $directory = $pending.Pop()
              foreach ($child in @(Get-ChildItem -LiteralPath $directory -Force -ErrorAction Stop)) {
                if (($child.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw "Magenta isolated tree contains a reparse point: $($child.FullName)"
                }
                if ($child.PSIsContainer) { [void]$pending.Push($child.FullName) }
              }
            }
          }

          function Assert-MagentaRunnerTempChild([string]$Path) {
            $separators = [char[]]@([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd($separators)
            $candidate = [IO.Path]::GetFullPath($Path).TrimEnd($separators)
            $runnerTempPrefix = $runnerTemp + [IO.Path]::DirectorySeparatorChar
            if (-not $candidate.StartsWith($runnerTempPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to clean a Magenta path outside RUNNER_TEMP: $candidate"
            }
          }

          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '^v(?<version>0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must be exact vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $tag.Substring(1)
          $isLegacyEightAssetContract = $tag -ceq "v0.0.27" -or $tag -ceq "v0.0.29"
          $requiresNineAssetContract = ([Version]$version -ge [Version]"0.0.30")
          if (-not $isLegacyEightAssetContract -and -not $requiresNineAssetContract) {
            throw "Unsupported historical release asset contract: $tag"
          }

          $downloadDirectory = Join-Path $env:RUNNER_TEMP "magenta-release"
          $installDirectory = Join-Path $env:RUNNER_TEMP "magenta-install"
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null

          $expectedAssets = @(
            "SHA256SUMS"
            "SOURCE_COMMIT"
            "install.ps1"
            "magenta-linux-x64"
            "magenta-macos-arm64"
            "magenta-macos-x64"
            "magenta-resources-universal.tar.gz"
            "magenta-windows-x64.exe"
          )
          if ($requiresNineAssetContract) {
            $expectedAssets += "install.sh"
          }
          $expectedAssets = @($expectedAssets | Sort-Object)

          try {
            $summaryJson = & node (Join-Path $env:GITHUB_WORKSPACE ".github/scripts/prepare-release-assets.mjs") `
              --allow-draft $env:ALLOW_DRAFT `
              --release-dir $downloadDirectory `
              --release-tag $tag `
              --repository "Minions-Land/Magenta-CLI"
            if ($LASTEXITCODE -ne 0) { throw "Bounded release asset preparation failed" }
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          }
          $release = $summaryJson | ConvertFrom-Json
          if ($release.tag -cne $tag -or [int]$release.assetCount -ne $expectedAssets.Count) {
            throw "Release asset preparation summary does not match the requested contract"
          }

          $actualAssets = @(Get-ChildItem -LiteralPath $downloadDirectory -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object $expectedAssets $actualAssets) {
            throw "Downloaded asset set does not exactly match the release contract"
          }

          $manifestExpected = @($expectedAssets | Where-Object { $_ -cne "SHA256SUMS" }) | Sort-Object
          $manifestEntries = @{}
          foreach ($line in [IO.File]::ReadAllLines((Join-Path $downloadDirectory "SHA256SUMS"))) {
            if ($line -cnotmatch '^(?<hash>[0-9a-f]{64})  (?<name>[A-Za-z0-9._-]+)$') {
              throw "Malformed SHA256SUMS line"
            }
            if ($manifestEntries.ContainsKey($Matches.name)) { throw "Duplicate SHA256SUMS entry" }
            $manifestEntries[$Matches.name] = $Matches.hash
          }
          $manifestActual = @($manifestEntries.Keys | Sort-Object)
          if (Compare-Object $manifestExpected $manifestActual) {
            throw "SHA256SUMS does not cover the exact release payload"
          }
          foreach ($name in $manifestExpected) {
            $actualHash = (Get-FileHash -LiteralPath (Join-Path $downloadDirectory $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -cne $manifestEntries[$name]) { throw "Manifest digest mismatch: $name" }
          }

          $sourceCommit = (Get-Content -Raw -LiteralPath (Join-Path $downloadDirectory "SOURCE_COMMIT")).Trim()
          if ($sourceCommit -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') {
            throw "SOURCE_COMMIT is not a full Git object ID"
          }

          try {
            & node (Join-Path $env:GITHUB_WORKSPACE ".github/scripts/verify-source-commit.mjs") `
              --release-dir $downloadDirectory `
              --release-tag $tag `
              --repository "Minions-Land/Magenta" `
              --require-main true
            if ($LASTEXITCODE -ne 0) { throw "Source tag binding verification failed" }
          } finally {
            Remove-Item Env:MAGENTA_SOURCE_READ_TOKEN -ErrorAction SilentlyContinue
          }

          $isolatedConfigRoot = Join-Path $env:RUNNER_TEMP "magenta-config-$([Guid]::NewGuid().ToString('N'))"
          $isolatedHome = Join-Path $isolatedConfigRoot "home"
          $codingAgentDirectory = Join-Path $isolatedConfigRoot "agent"
          $isolatedTemp = Join-Path $isolatedConfigRoot "temp"
          $isolatedAppData = Join-Path $isolatedHome "AppData/Roaming"
          $isolatedLocalAppData = Join-Path $isolatedHome "AppData/Local"
          New-Item -ItemType Directory -Path $isolatedConfigRoot -ErrorAction Stop | Out-Null
          foreach ($directory in @(
            $isolatedHome, $codingAgentDirectory, $isolatedTemp,
            $isolatedAppData, $isolatedLocalAppData
          )) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }
          Assert-MagentaPlainTree $isolatedConfigRoot

          $isolatedEnvironment = [ordered]@{
            "APPDATA" = $isolatedAppData
            "HOME" = $isolatedHome
            "LOCALAPPDATA" = $isolatedLocalAppData
            "MAGENTA_CODING_AGENT_DIR" = $codingAgentDirectory
            "MAGENTA_PEER_MESSAGE_DB" = (Join-Path $isolatedConfigRoot "messages.db")
            "NO_COLOR" = "1"
            "PI_OFFLINE" = "1"
            "PI_SKIP_VERSION_CHECK" = "1"
            "TEMP" = $isolatedTemp
            "TMP" = $isolatedTemp
            "USERPROFILE" = $isolatedHome
          }
          $originalEnvironment = @{}
          foreach ($name in $isolatedEnvironment.Keys) {
            $originalEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, "Process")
          }
          try {
            foreach ($name in $isolatedEnvironment.Keys) {
              [Environment]::SetEnvironmentVariable($name, $isolatedEnvironment[$name], "Process")
            }
            $assetServer = Start-Process -FilePath "python" -ArgumentList @(
              "-m", "http.server", "8766", "--bind", "127.0.0.1", "--directory", $downloadDirectory
            ) -PassThru -WindowStyle Hidden
            try {
              $ready = $false
              foreach ($attempt in 1..50) {
                try {
                  Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8766/SHA256SUMS" -OutFile (Join-Path $env:RUNNER_TEMP "server-probe")
                  $ready = $true
                  break
                } catch {
                  Start-Sleep -Milliseconds 100
                }
              }
              if (-not $ready) { throw "Local verified-asset server did not become ready" }

              & (Join-Path $downloadDirectory "install.ps1") `
                -InstallDir $installDirectory `
                -Version $tag `
                -Repository "Minions-Land/Magenta-CLI" `
                -AssetBaseUrl "http://127.0.0.1:8766" `
                -NoPath
              if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
            } finally {
              Stop-Process -Id $assetServer.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $assetServer.Id -ErrorAction SilentlyContinue
            }

            $binary = Join-Path $installDirectory "magenta.exe"
            $reportedVersion = (& $binary --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $reportedVersion -cne $version) {
              throw "Installed version mismatch: expected $version, got $reportedVersion"
            }

            if ($requiresNineAssetContract) {
              & $binary --help --offline smoke | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Installed Magenta binary failed isolated helper startup" }

              Assert-MagentaPlainTree $isolatedConfigRoot
              $processToolsCache = Join-Path $isolatedConfigRoot "cache/process-tools"
              $processToolsRootItem = Get-Item -LiteralPath $processToolsCache -Force -ErrorAction Stop
              if (-not $processToolsRootItem.PSIsContainer -or ($processToolsRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "process-tools cache root is not a plain directory"
              }
              $processToolsGenerations = @(
                foreach ($entry in @(Get-ChildItem -LiteralPath $processToolsCache -Force -ErrorAction Stop)) {
                  if ($entry.Name -cnotmatch '^[0-9a-f]{64}$') { continue }
                  if (-not $entry.PSIsContainer -or ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                    throw "process-tools generation is not a plain directory: $($entry.FullName)"
                  }
                  $entry
                }
              )
              if ($processToolsGenerations.Count -ne 1) {
                throw "Expected exactly one process-tools digest generation"
              }
              $processToolsGeneration = $processToolsGenerations[0]
              $processTools = Join-Path $processToolsGeneration.FullName "magenta-process-tools.exe"
              $processToolsItem = Get-Item -LiteralPath $processTools -Force -ErrorAction Stop
              if ($processToolsItem.PSIsContainer -or ($processToolsItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "process-tools cache entry is not a regular file"
              }
              $processToolsHash = (Get-FileHash -LiteralPath $processTools -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($processToolsHash -cne $processToolsGeneration.Name) {
                throw "process-tools cache digest does not match its directory name"
              }
              & $processTools --help | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "process-tools failed --help" }
            } else {
              & $binary --help | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Installed legacy Magenta binary failed --help" }
              $processTools = Join-Path $installDirectory "_magenta/process-tools/target/release/magenta-process-tools.exe"
              $processToolsItem = Get-Item -LiteralPath $processTools -Force -ErrorAction Stop
              if ($processToolsItem.PSIsContainer -or ($processToolsItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Legacy process-tools entry is not a regular file"
              }
              & $processTools --help | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Legacy process-tools failed --help" }
            }

            $clipboard = Join-Path $installDirectory "runtime/node_modules/@mariozechner/clipboard-win32-x64-msvc/clipboard.win32-x64-msvc.node"
            node -e 'const binding = require(process.argv[1]); if (typeof binding.getText !== "function") process.exit(1)' $clipboard
            if ($LASTEXITCODE -ne 0) { throw "Windows clipboard native binding failed to load" }

            & (Join-Path $downloadDirectory "install.ps1") -InstallDir $installDirectory -NoPath -Uninstall
            if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $installDirectory)) {
              throw "install.ps1 uninstall verification failed"
            }
          } finally {
            foreach ($name in $isolatedEnvironment.Keys) {
              [Environment]::SetEnvironmentVariable($name, $originalEnvironment[$name], "Process")
            }
            try {
              Assert-MagentaRunnerTempChild $isolatedConfigRoot
              Assert-MagentaPlainTree $isolatedConfigRoot
              Remove-Item -LiteralPath $isolatedConfigRoot -Recurse -Force -ErrorAction Stop
            } catch {
              Write-Warning "Preserving unsafe Magenta runner temp state at ${isolatedConfigRoot}: $($_.Exception.Message)"
              throw
            }
          }

          Write-Host "verified_tag=$tag"
          Write-Host "verified_version=$version"
          Write-Host "verified_draft=$($release.draft)"
          Write-Host "source_commit=$sourceCommit"
          Write-Host "assets=$($expectedAssets.Count)"
          Write-Host "asset_contract=$(if ($requiresNineAssetContract) { 'current-nine' } else { 'legacy-eight' })"
          Write-Host "api_digests=ok"
          Write-Host "manifest=ok"
          Write-Host "macos_apple_signing=not-required"
          Write-Host "windows_install=ok"
          Write-Host "windows_binary=ok"
          Write-Host "windows_process_tools=ok"
          Write-Host "windows_clipboard=ok"
          Write-Host "windows_uninstall=ok"

  macos-runtime:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    environment:
      name: source-verification
    name: Verify macOS runtime (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ALLOW_DRAFT: ${{ inputs.allow_draft }}
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: refs/heads/main

      - name: Verify checksums, provenance, and native startup
        env:
          GH_TOKEN: ${{ github.token }}
          MAGENTA_SOURCE_READ_TOKEN: ${{ secrets.MAGENTA_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          trap 'unset GH_TOKEN GITHUB_TOKEN MAGENTA_SOURCE_READ_TOKEN' EXIT
          if [ -z "${MAGENTA_SOURCE_READ_TOKEN:-}" ]; then
            echo "::error::MAGENTA_SOURCE_READ_TOKEN is required for private source verification" >&2
            exit 1
          fi
          node .github/scripts/verify-macos-published-release.mjs \
            --allow-draft "$ALLOW_DRAFT" \
            --native-architecture "${{ matrix.architecture }}" \
            --release-dir "$RUNNER_TEMP/magenta-macos-release" \
            --release-tag "$RELEASE_TAG" \
            --repository "Minions-Land/Magenta-CLI" \
            --require-main true
